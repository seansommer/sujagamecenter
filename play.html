<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7efe9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bottles Up! · SUJA Game Center</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7efe9;color:#193e2b;font-family:system-ui,sans-serif}body{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}iframe{display:block;border:0;width:100%;height:100%;background:#e7efe9}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#e7efe9}#loading[hidden]{display:none}a{color:#08643b}noscript{position:absolute;inset:20%;background:#e7efe9}
:root[data-theme=dark] body,:root[data-theme=dark] iframe,:root[data-theme=dark] #loading{background:#11291d;color:#e4f0e2}:root[data-theme=dark] a{color:#a1db86}</style>
</head>
<body>
<div id="loading" role="status"><strong>Opening Bottles Up!…</strong><a href="./">Back to Game Center</a></div>
<iframe id="game" title="Bottles Up!" allow="autoplay; fullscreen" allowfullscreen></iframe>
<noscript>Enable JavaScript to play. <a href="./">Back to Game Center</a></noscript>
<script type="module">
import {initTheme} from './src/theme.js';
initTheme();
import {bottlesURL,returnToHub} from './src/game-launch.js';
const frame=document.getElementById('game');
frame.addEventListener('load',()=>{
 if(!frame.getAttribute('src'))return;
 try{
  const doc=frame.contentDocument;
  if(!doc?.getElementById('world'))return;
  // Keep return navigation in the installed app instead of nesting the hub in the frame.
  for(const link of doc.querySelectorAll('a[href]'))if(returnToHub(link.href,location.href))link.target='_top';
  document.getElementById('loading').hidden=true;
 }catch{}
});
const isStacker=new URL(location.href).searchParams.get('game')==='pallet-stacker';
if(isStacker){document.title='Pallet Stacker · SUJA Game Center';frame.title='Pallet Stacker';document.querySelector('#loading strong').textContent='Opening Pallet Stacker…';}
if(isStacker){frame.src=bottlesURL(location.href);}else{const target=new URL('./bottles-up.html',location.href);target.search=location.search;location.replace(target.href);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body>
</html>
