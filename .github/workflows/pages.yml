name: Build, test, and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: seansommer/Pallet-Stacker
          ref: 9619fb5f089c6542a2537d15cdfe0300099e8076
          path: .games/pallet-stacker
      - uses: actions/checkout@v4
        with:
          repository: seansommer/Sujalaga
          ref: f5120ecf57b3c116256c7a52879c827d4913b765
          path: .games/sujalaga
      - uses: actions/checkout@v4
        with:
          repository: seansommer/SujaPinball
          ref: 17aba31ad41b68288f59eb3b9487bc080f3e10e5
          path: .games/suja-pinball
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run build
        working-directory: .games/pallet-stacker
      - run: npm ci && npm test && npm run build
        working-directory: .games/sujalaga
      - run: npm ci && npm test && npm run build
        working-directory: .games/suja-pinball
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PALLET_STACKER_DIST: .games/pallet-stacker/dist
          SUJALAGA_DIST: .games/sujalaga/dist
          PINBALL_DIST: .games/suja-pinball/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
